[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai-access"
  to = "/.netlify/functions/ai-access"
  status = 200

[[redirects]]
  from = "/api/decks/generate"
  to = "/.netlify/functions/decks-generate"
  status = 200

[[redirects]]
  from = "/api/decks/revise"
  to = "/.netlify/functions/decks-revise"
  status = 200

[[redirects]]
  from = "/api/credits/checkout"
  to = "/.netlify/functions/credits-checkout"
  status = 200

[[redirects]]
  from = "/api/payments/midtrans"
  to = "/.netlify/functions/payments-midtrans"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Berkas di /assets namanya ber-hash (Vite), jadi aman di-cache selamanya —
# kunjungan berikutnya tidak perlu bertanya ulang ke server untuk tiap chunk.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
