[build]
  command = "pnpm --filter @flipcard/web build"
  publish = "apps/web/dist"
  functions = "apps/web/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai-access"
  to = "/.netlify/functions/ai-access"
  status = 200

[[redirects]]
  from = "/api/decks/generate"
  to = "/.netlify/functions/decks-generate"
  status = 200

[[redirects]]
  from = "/api/decks/revise"
  to = "/.netlify/functions/decks-revise"
  status = 200

[[redirects]]
  from = "/api/credits/checkout"
  to = "/.netlify/functions/credits-checkout"
  status = 200

[[redirects]]
  from = "/api/payments/midtrans"
  to = "/.netlify/functions/payments-midtrans"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
